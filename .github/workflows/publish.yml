name: Publish crates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          is_published() {
            local crate="$1"
            curl --fail --silent --show-error \
              --user-agent "ascolta-release-ci" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }
          wait_for_index() {
            local crate="$1"
            for _ in $(seq 1 30); do
              if is_published "${crate}"; then
                return 0
              fi
              sleep 2
            done
            echo "timed out waiting for ${crate} ${version} in the index" >&2
            return 1
          }

          for crate in ascolta-domain ascolta-mpd ascolta; do
            if is_published "${crate}"; then
              echo "${crate} ${version} is already published; skipping"
            else
              cargo publish -p "${crate}" --locked
              wait_for_index "${crate}"
            fi
          done
