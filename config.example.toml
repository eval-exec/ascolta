# Copy to ~/.config/neo-ncmp/config.toml

[mpd]
host = "127.0.0.1"
port = 6600

# MPD servers configured with `password_file` need this. It is sent on every
# connection (command, idle, library-loading, and artwork connections).
# password = "secret"

[ui]
# Event loop tick. Also controls progress interpolation and status refresh.
tick_rate_ms = 250

# queue | library | playlists | outputs | stats | lyrics | visualizer | tags | history
start_screen = "queue"

# Move the queue cursor to the playing song as tracks change.
follow_now_playing = false

# Desktop notification on track change.
notifications = false

# Restore the last screen, cursors, and lyrics offset on start.
restore_session = true

# Opt in to mouse capture: wheel scrolls, clicking a tab switches screens,
# clicking a row selects it, and double-clicking activates it.
mouse = false

# Fetch lyrics for the current song and show the active line in the Now Playing
# card at the bottom of the screen.
lyrics_in_card = true

# Draw small artwork thumbnails at the start of queue/library rows.
inline_art = true

[layout]
# Library pane percentages.
artists_width = 30
albums_width = 32
songs_width = 38
# Playlist list width, with the songs pane taking the rest.
playlists_width = 30

[library]
# Root of MPD's music directory. Required for local .lrc files and tag editing.
music_directory = "/home/you/Music"

[visualizer]
# "fifo" uses an MPD fifo audio output; "pipewire" captures the default sink
# with pw-record (works without changing MPD's output).
enabled = false
source = "fifo"
fifo = "/tmp/mpd.fifo"
# Optional PipeWire sink name; by default the current default sink is used.
# target = "alsa_output.pci-0000_00_1f.3.HiFi__Speaker__sink"
sample_rate = 44100
channels = 2
bits = 16
bars = 64

[artwork]
# When embedded/folder art is missing, look it up on MusicBrainz and the
# Cover Art Archive. Results are cached in ~/.cache/neo-ncmp/covers.
online = false

# Fetch artist portraits for artist rows from Deezer (no API key required).
# Results are cached in ~/.cache/neo-ncmp/artists.
artist_images = true

[search.saved]
# Named filter queries appear in the command palette as smart playlists.
# Open one, then Enter a result, Ctrl-A to enqueue all, or Ctrl-R to play all.
# "90s" = "year:1990-1999"
# "Favourites" = "artist:portishead album:dummy"

[ipc]
# Per-user Unix socket for app-specific commands (mode 0600). Use `path` if
# the default runtime-directory path is unsuitable.
enabled = true
# path = "/run/user/1000/neo-ncmp/socket"

[scrobbling]
# Disabled by default. Tokens can also come from environment variables:
# NEO_NCMP_LISTENBRAINZ_TOKEN, NEO_NCMP_LASTFM_API_KEY,
# NEO_NCMP_LASTFM_API_SECRET, NEO_NCMP_LASTFM_SESSION_KEY
enabled = false
listenbrainz_token = ""
lastfm_api_key = ""
lastfm_api_secret = ""
lastfm_session_key = ""

[stats]
# Record plays into ~/.local/state/neo-ncmp/neo-ncmp.db (History screen).
enabled = true

# Key overrides. Sections are `global`, `queue`, `library`, `playlists`,
# `outputs`, `stats`, `lyrics`, `visualizer`, `tags`, `history`.
# Use "none" to unbind. Key specs support ctrl+, alt+, shift+, named keys
# (space, tab, enter, esc, arrows, pageup/pagedown, home/end), and symbols.
[keys.global]
# "ctrl+j" = "next_track"
# ":" = "palette"

[keys.queue]
# "d" = "play_selected"

[keys.library]
# "enter" = "play_selected"

[theme]
# Hex (#rrggbb) or ANSI names: black, red, green, yellow, blue, magenta,
# cyan, gray, darkgray, white, reset.
bg = "#1a1b26"
fg = "#c0caf5"
dim = "#565f89"
accent = "#7aa2f7"
green = "#9ece6a"
red = "#f7768e"
yellow = "#e0af68"
purple = "#bb9af7"
cyan = "#7dcfff"
border = "#3b4267"
selected_bg = "#283457"
