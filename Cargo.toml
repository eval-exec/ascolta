[workspace]
resolver = "3"
members = ["crates/ascolta", "crates/ascolta-domain", "crates/ascolta-mpd"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eval-exec/ascolta"

[workspace.dependencies]
ascolta-domain = { path = "crates/ascolta-domain", version = "0.0.1" }
ascolta-mpd = { path = "crates/ascolta-mpd", version = "0.0.1" }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
    "io-std",
    "fs",
] }
thiserror = "2"
tracing = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
