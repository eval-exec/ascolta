[package]
name = "neo-ncmp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A modern, feature-rich terminal client for MPD"

[[bin]]
name = "neo-ncmp"
path = "src/main.rs"

[dependencies]
neo-ncmp-domain.workspace = true
neo-ncmp-mpd.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
tokio.workspace = true
toml = "0.9"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
mpris-server = { version = "0.11", features = ["tokio"] }
notify-rust = "4.17.0"
realfft = "3.5.1"
lofty = "0.25"
md-5 = "0.11.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
libc = "0.2.191"
